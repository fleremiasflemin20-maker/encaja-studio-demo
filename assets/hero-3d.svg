<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 600" width="1280" height="600" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0d1a"/><stop offset=".55" stop-color="#141033"/><stop offset="1" stop-color="#1a0f24"/>
    </linearGradient>
    <radialGradient id="orbA" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#6e5bff" stop-opacity=".55"/><stop offset="1" stop-color="#6e5bff" stop-opacity="0"/></radialGradient>
    <radialGradient id="orbB" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ff5e9a" stop-opacity=".45"/><stop offset="1" stop-color="#ff5e9a" stop-opacity="0"/></radialGradient>
    <radialGradient id="orbC" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffb800" stop-opacity=".35"/><stop offset="1" stop-color="#ffb800" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#ffffff" fill-opacity=".07"/></pattern>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3a3a44"/><stop offset=".5" stop-color="#1c1c22"/><stop offset="1" stop-color="#2c2c34"/></linearGradient>
    <linearGradient id="side" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0d0d12"/><stop offset="1" stop-color="#26262e"/></linearGradient>
    <linearGradient id="cafe" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b4532a"/><stop offset="1" stop-color="#e9a46a"/></linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00e0b8"/><stop offset="1" stop-color="#7b61ff"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#007aff"/><stop offset="1" stop-color="#5ac8fa"/></linearGradient>
    <linearGradient id="ai" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6e5bff"/><stop offset=".6" stop-color="#e2479a"/><stop offset="1" stop-color="#ff9f1c"/></linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#000" flood-opacity=".55"/></filter>
    <clipPath id="scrM"><rect x="12" y="12" width="236" height="476" rx="34"/></clipPath>
    <clipPath id="phoneM"><rect width="260" height="500" rx="44"/></clipPath>
    <clipPath id="scrS"><rect x="10" y="10" width="190" height="390" rx="28"/></clipPath>
  </defs>

  <rect width="1280" height="600" fill="url(#bg)"/>
  <rect width="1280" height="600" fill="url(#dots)"/>

  <!-- Orbes de luz -->
  <ellipse cx="300" cy="180" rx="260" ry="200" fill="url(#orbA)">
    <animate attributeName="cx" values="300;360;300" dur="11s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="1000" cy="420" rx="280" ry="210" fill="url(#orbB)">
    <animate attributeName="cy" values="420;360;420" dur="13s" repeatCount="indefinite"/>
  </ellipse>
  <ellipse cx="660" cy="560" rx="300" ry="150" fill="url(#orbC)">
    <animate attributeName="rx" values="300;360;300" dur="9s" repeatCount="indefinite"/>
  </ellipse>

  <!-- Sombras en el piso -->
  <g filter="url(#blur)" fill="#000">
    <ellipse cx="335" cy="545" rx="120" ry="18" opacity=".6"><animate attributeName="opacity" values=".6;.35;.6" dur="6s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="640" cy="565" rx="150" ry="22" opacity=".7"><animate attributeName="opacity" values=".45;.75;.45" dur="6s" repeatCount="indefinite"/></ellipse>
    <ellipse cx="945" cy="545" rx="120" ry="18" opacity=".6"><animate attributeName="opacity" values=".35;.6;.35" dur="6s" repeatCount="indefinite"/></ellipse>
  </g>

  <!-- ===== Teléfono izquierdo: estilo Neón (mirando a la derecha) ===== -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 -14;0 0" dur="6s" repeatCount="indefinite"/>
    <g transform="matrix(0.88 0.2 0 1 228 80)" filter="url(#soft)">
      <rect x="-12" y="8" width="210" height="410" rx="34" fill="url(#side)"/>
      <rect width="210" height="410" rx="34" fill="url(#frame)"/>
      <g clip-path="url(#scrS)">
        <rect x="10" y="10" width="190" height="390" fill="#0b0d17"/>
        <rect x="70" y="18" width="70" height="18" rx="9" fill="#000"/>
        <text x="24" y="70" fill="#00e0b8" font-size="20" font-weight="800">Tu día</text>
        <rect x="24" y="84" width="56" height="44" rx="10" fill="url(#neon)"/>
        <rect x="86" y="84" width="50" height="44" rx="10" fill="#141a2c"/>
        <rect x="142" y="84" width="46" height="44" rx="10" fill="#141a2c"/>
        <text x="32" y="106" fill="#06120f" font-size="12" font-weight="800">8,432</text>
        <circle cx="62" cy="172" r="28" fill="none" stroke="#262d47" stroke-width="8"/>
        <circle cx="62" cy="172" r="28" fill="none" stroke="#00e0b8" stroke-width="8" stroke-dasharray="120 176" transform="rotate(-90 62 172)">
          <animate attributeName="stroke-dasharray" values="20 176;130 176;20 176" dur="6s" repeatCount="indefinite"/>
        </circle>
        <rect x="102" y="158" width="80" height="10" rx="5" fill="#262d47"/><rect x="102" y="176" width="56" height="8" rx="4" fill="#262d47"/>
        <rect x="24" y="214" width="164" height="96" rx="14" fill="#141a2c"/>
        <polyline points="36,290 60,270 84,280 108,250 132,262 156,236 178,244" fill="none" stroke="#00e0b8" stroke-width="3" stroke-linejoin="round"/>
        <rect x="24" y="322" width="164" height="38" rx="12" fill="url(#neon)"/>
        <rect x="24" y="368" width="164" height="26" rx="13" fill="#141a2c"/>
      </g>
      <rect width="210" height="410" rx="34" fill="url(#shine)" opacity=".5"/>
    </g>
  </g>

  <!-- ===== Teléfono derecho: estilo Cupertino (mirando a la izquierda) ===== -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 -12;0 2;0 -12" dur="6s" repeatCount="indefinite"/>
    <g transform="matrix(0.88 -0.2 0 1 868 122)" filter="url(#soft)">
      <rect x="12" y="8" width="210" height="410" rx="34" fill="url(#side)"/>
      <rect width="210" height="410" rx="34" fill="url(#frame)"/>
      <g clip-path="url(#scrS)">
        <rect x="10" y="10" width="190" height="390" fill="#ffffff"/>
        <rect x="70" y="18" width="70" height="18" rx="9" fill="#000"/>
        <text x="22" y="74" fill="#111" font-size="22" font-weight="800">Resumen</text>
        <rect x="22" y="88" width="166" height="74" rx="14" fill="url(#blue)"/>
        <text x="34" y="118" fill="#fff" font-size="17" font-weight="800">$12,480.50</text>
        <rect x="34" y="132" width="60" height="16" rx="8" fill="#fff"/>
        <rect x="22" y="172" width="80" height="44" rx="12" fill="url(#blue)" opacity=".85"/>
        <rect x="108" y="172" width="80" height="44" rx="12" fill="url(#blue)" opacity=".85"/>
        <rect x="22" y="226" width="166" height="80" rx="14" fill="#f2f2f7"/>
        <path d="M32 292 L66 268 L100 280 L134 250 L178 262 L178 298 L32 298 Z" fill="#5ac8fa" opacity=".35"/>
        <polyline points="32,292 66,268 100,280 134,250 178,262" fill="none" stroke="#007aff" stroke-width="3"/>
        <rect x="22" y="316" width="166" height="72" rx="14" fill="#f2f2f7"/>
        <rect x="34" y="330" width="100" height="9" rx="4" fill="#d9d9de"/><rect x="34" y="350" width="130" height="9" rx="4" fill="#d9d9de"/><rect x="34" y="370" width="80" height="9" rx="4" fill="#d9d9de"/>
      </g>
      <rect width="210" height="410" rx="34" fill="url(#shine)" opacity=".5"/>
    </g>
  </g>

  <!-- ===== Teléfono central: se arma solo, pieza por pieza ===== -->
  <g>
    <animateTransform attributeName="transform" type="translate" values="0 -6;0 -22;0 -6" dur="6s" repeatCount="indefinite"/>
    <g transform="translate(510 52)" filter="url(#soft)">
      <rect x="-8" y="10" width="276" height="500" rx="44" fill="url(#side)" opacity=".9"/>
      <rect width="260" height="500" rx="44" fill="url(#frame)"/>
      <g clip-path="url(#scrM)">
        <rect x="12" y="12" width="236" height="476" fill="#ffffff"/>
        <rect x="90" y="22" width="80" height="22" rx="11" fill="#000"/>
        <!-- Contorno de "suelta aquí" -->
        <rect x="26" y="114" width="208" height="300" rx="16" fill="none" stroke="#c9cfdb" stroke-width="2" stroke-dasharray="7 7">
          <animate attributeName="opacity" values="1;0;0;1" keyTimes="0;.2;.92;1" dur="8s" repeatCount="indefinite"/>
        </rect>
        <!-- Barra superior -->
        <g>
          <animateTransform attributeName="transform" type="translate" values="-340 -40;0 0;0 0;0 0" keyTimes="0;.12;.92;1" dur="8s" repeatCount="indefinite" calcMode="spline" keySplines=".2 .8 .2 1;0 0 1 1;0 0 1 1"/>
          <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.06;.92;1" dur="8s" repeatCount="indefinite"/>
          <text x="130" y="82" text-anchor="middle" fill="#111" font-size="17" font-weight="800">Café Luna</text>
          <rect x="26" y="70" width="20" height="3" rx="1.5" fill="#111"/><rect x="26" y="77" width="20" height="3" rx="1.5" fill="#111"/><rect x="26" y="84" width="20" height="3" rx="1.5" fill="#111"/>
        </g>
        <!-- Banner -->
        <g>
          <animateTransform attributeName="transform" type="translate" values="-360 20;-360 20;0 0;0 0;0 0" keyTimes="0;.12;.26;.92;1" dur="8s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;.2 .8 .2 1;0 0 1 1;0 0 1 1"/>
          <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.14;.2;.92;1" dur="8s" repeatCount="indefinite"/>
          <rect x="26" y="114" width="208" height="92" rx="16" fill="url(#cafe)"/>
          <text x="42" y="148" fill="#fff" font-size="19" font-weight="800">2×1 en lattes</text>
          <rect x="42" y="166" width="72" height="22" rx="11" fill="#fff"/>
          <text x="78" y="181" text-anchor="middle" fill="#b4532a" font-size="11" font-weight="700">Ver menú</text>
          <text x="214" y="200" text-anchor="end" font-size="40">☕</text>
        </g>
        <!-- Tarjetas -->
        <g>
          <animateTransform attributeName="transform" type="translate" values="-380 30;-380 30;0 0;0 0;0 0" keyTimes="0;.28;.42;.92;1" dur="8s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;.2 .8 .2 1;0 0 1 1;0 0 1 1"/>
          <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.3;.36;.92;1" dur="8s" repeatCount="indefinite"/>
          <rect x="26" y="218" width="100" height="94" rx="14" fill="#f2f4f8"/>
          <rect x="134" y="218" width="100" height="94" rx="14" fill="#f2f4f8"/>
          <text x="40" y="256" font-size="26">🥐</text><text x="148" y="256" font-size="26">🥛</text>
          <text x="40" y="290" fill="#141821" font-size="12" font-weight="700">Croissant</text><text x="148" y="290" fill="#141821" font-size="12" font-weight="700">Latte</text>
          <text x="40" y="304" fill="#b4532a" font-size="11" font-weight="800">$2.50</text><text x="148" y="304" fill="#b4532a" font-size="11" font-weight="800">$3.80</text>
        </g>
        <!-- Botón -->
        <g>
          <animateTransform attributeName="transform" type="translate" values="-400 40;-400 40;0 0;0 0;0 0" keyTimes="0;.44;.58;.92;1" dur="8s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;.2 .8 .2 1;0 0 1 1;0 0 1 1"/>
          <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.46;.52;.92;1" dur="8s" repeatCount="indefinite"/>
          <rect x="26" y="326" width="208" height="44" rx="12" fill="#b4532a"/>
          <text x="130" y="353" text-anchor="middle" fill="#fff" font-size="14" font-weight="700">Hacer pedido</text>
        </g>
        <!-- Pestañas -->
        <g>
          <animateTransform attributeName="transform" type="translate" values="0 90;0 90;0 0;0 0;0 0" keyTimes="0;.58;.68;.92;1" dur="8s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;.2 .8 .2 1;0 0 1 1;0 0 1 1"/>
          <rect x="12" y="420" width="236" height="68" fill="#ffffff"/>
          <rect x="12" y="420" width="236" height="1" fill="#e2e6ee"/>
          <circle cx="58" cy="442" r="8" fill="#b4532a"/><circle cx="130" cy="442" r="8" fill="#c3c8d4"/><circle cx="202" cy="442" r="8" fill="#c3c8d4"/>
          <text x="58" y="466" text-anchor="middle" fill="#b4532a" font-size="10" font-weight="700">Inicio</text>
          <text x="130" y="466" text-anchor="middle" fill="#8a90a0" font-size="10" font-weight="700">Menú</text>
          <text x="202" y="466" text-anchor="middle" fill="#8a90a0" font-size="10" font-weight="700">Perfil</text>
        </g>
        <rect x="80" y="476" width="100" height="5" rx="2.5" fill="#111"/>
      </g>
      <g clip-path="url(#phoneM)"><rect width="260" height="500" rx="44" fill="url(#shine)" opacity=".55">
        <animate attributeName="x" values="-260;260;260" keyTimes="0;.35;1" dur="8s" repeatCount="indefinite"/>
      </rect></g>
      <!-- Destello cuando queda lista -->
      <rect x="-6" y="-6" width="272" height="512" rx="48" fill="none" stroke="#6e5bff" stroke-width="4" opacity="0">
        <animate attributeName="opacity" values="0;0;.9;0;0" keyTimes="0;.68;.74;.86;1" dur="8s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- Etiquetas de pieza que vuelan con el arrastre -->
  <g font-size="13" font-weight="700">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 0;330 -20;330 -20" keyTimes="0;.12;.24;1" dur="8s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;.2 .8 .2 1;0 0 1 1"/>
      <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;.12;.14;.25;1" dur="8s" repeatCount="indefinite"/>
      <rect x="200" y="200" width="104" height="34" rx="12" fill="url(#ai)"/>
      <text x="252" y="222" text-anchor="middle" fill="#fff">🧩 Banner</text>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 0;330 -10;330 -10" keyTimes="0;.28;.4;1" dur="8s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;.2 .8 .2 1;0 0 1 1"/>
      <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;.28;.3;.41;1" dur="8s" repeatCount="indefinite"/>
      <rect x="190" y="300" width="120" height="34" rx="12" fill="url(#ai)"/>
      <text x="250" y="322" text-anchor="middle" fill="#fff">🧩 Productos</text>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 0;330 0;330 0" keyTimes="0;.44;.56;1" dur="8s" repeatCount="indefinite" calcMode="spline" keySplines="0 0 1 1;.2 .8 .2 1;0 0 1 1"/>
      <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;.44;.46;.57;1" dur="8s" repeatCount="indefinite"/>
      <rect x="196" y="390" width="104" height="34" rx="12" fill="url(#ai)"/>
      <text x="248" y="412" text-anchor="middle" fill="#fff">🧩 Botón</text>
    </g>
  </g>

  <!-- Chispas de IA -->
  <g fill="#ffd166">
    <path d="M1090 120 l6 16 16 6 -16 6 -6 16 -6 -16 -16 -6 16 -6z"><animate attributeName="opacity" values="0;1;0" dur="2.6s" repeatCount="indefinite"/></path>
    <path d="M180 470 l4 11 11 4 -11 4 -4 11 -4 -11 -11 -4 11 -4z" fill="#ff9fcf"><animate attributeName="opacity" values="1;0;1" dur="3.2s" repeatCount="indefinite"/></path>
    <path d="M820 70 l3 9 9 3 -9 3 -3 9 -3 -9 -9 -3 9 -3z" fill="#9f93ff"><animate attributeName="opacity" values="0;1;0" dur="2.1s" begin=".7s" repeatCount="indefinite"/></path>
  </g>
</svg>
